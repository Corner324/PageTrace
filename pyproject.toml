[project]
name = "pagetrace"
version = "0.1.0"
description = "Offline checker for API pagination traces. Never claims more than the trace proves."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "PageTrace maintainers" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
# Exactly one runtime dependency, the RFC 9535 JSONPath engine (docs/adr/0003). Every further
# addition needs an ADR-level justification (see docs/engineering-principles.md #5).
dependencies = [
    "python-jsonpath>=2.2.1",
]

[project.scripts]
pagetrace = "pagetrace.cli:main"

[project.urls]
Homepage = "https://github.com/OWNER/pagetrace"
Changelog = "https://github.com/OWNER/pagetrace/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "hypothesis>=6.130",
  "ruff>=0.12",
  "pyright>=1.1.400",
  "jsonschema>=4.23",
  "mutmut>=3",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PT", "T20"]
ignore = ["S101"]  # assert is the test oracle

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"benchmarks/**" = ["T20"]
"src/pagetrace/cli.py" = ["T20"]
"src/pagetrace/render/**" = ["T20"]

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "tests", "benchmarks"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportMissingTypeStubs = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import the shared builders in tests/factories.py
addopts = "-ra --strict-markers"
markers = [
  "acceptance: end-to-end CLI tests",
  "slow: only in nightly / extended profile",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["pagetrace"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------- mutmut
[tool.mutmut]
# mutmut copies the whole source tree into `mutants/` and imports it from there, so the package
# has to be named whole: naming only the interesting submodules leaves the copy missing the ones
# the tests import.
source_paths = ["src/pagetrace/"]
# Renderers and argparse wiring are not worth the budget (docs/testing.md).
do_not_mutate = [
  "src/pagetrace/render/*",
  "src/pagetrace/cli.py",
  "src/pagetrace/__main__.py",
]
# Unit tests only: a mutant has to be killed hundreds of times over, and the property suite takes
# seconds per run. The property tests still guard the same code in CI, just not once per mutant.
pytest_add_cli_args_test_selection = ["tests/unit/"]
