name: Feature
description: New detector, preset, input format, or output change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What goes undetected or unsupported today.
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: What could be proven, and what cannot
      description: Preconditions, the claim, and the cases where PageTrace must stay silent.
    validations:
      required: true
  - type: dropdown
    id: spec
    attributes:
      label: Spec impact
      options:
        - specs/invariants.md
        - specs/product.md
        - specs/formats/*
        - none
    validations:
      required: true
